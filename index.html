<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>ru.</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <a href="#" class="brand" id="homeLogo" aria-label="Главная">
        ru<span>.</span>
      </a>
    </header>

    <main id="app">
      <section id="screen" aria-live="polite">
        <!-- Содержимое текущего экрана -->
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Основная навигация">

      <button class="nav-item active"
        data-page="planner" aria-label="Планер">
        <span class="nav-circle">⌂</span>
      </button>

      <button class="nav-item"
        data-page="study" aria-label="Учёба">
        <span class="nav-circle">▤</span>
      </button>

      <button class="nav-item"
        data-page="nutrition" aria-label="Питание">
        <span class="nav-circle">♡</span>
      </button>

      <button class="nav-item"
        data-page="sport" aria-label="Спорт">
        <span class="nav-circle">⌁</span>
      </button>

      <button class="nav-item"
        data-page="focus" aria-label="Focus Time">
        <span class="nav-circle">◷</span>
      </button>

      <button class="nav-item"
        data-page="profile" aria-label="Профиль и настройки">
        <span class="nav-circle">○</span>
      </button>

    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
